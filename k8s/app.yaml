apiVersion: v1
kind: Namespace
metadata:
  name: ijzerhaven
---
# ---------------------------------------------------------------- Postgres
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ijzerhaven
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          # pg_stat_statements gives per-query timings for the SQL dashboard.
          args: ["-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
          env:
            - { name: POSTGRES_USER, value: ijzerhaven }
            - { name: POSTGRES_PASSWORD, value: ijzerhaven }
            - { name: POSTGRES_DB, value: orders }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "ijzerhaven"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ijzerhaven
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
# ---------------------------------------------------------------- orders-web
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-web
  namespace: ijzerhaven
spec:
  replicas: 3
  selector:
    matchLabels: { app: orders-web }
  template:
    metadata:
      labels: { app: orders-web }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels: { app: orders-web }
      containers:
        - name: orders-web
          image: ijzerhaven/orders-web:1
          imagePullPolicy: Never
          ports: [{ containerPort: 3000 }]
          env:
            - { name: APPSIGNAL_ACTIVE, value: "true" }
            - { name: APPSIGNAL_APP_ENV, value: production }
            - { name: APPSIGNAL_IGNORE_ACTIONS, value: "GET /healthz" }
            - name: APPSIGNAL_APP_NAME
              valueFrom: { secretKeyRef: { name: appsignal-app, key: app-name } }
            - name: APPSIGNAL_PUSH_API_KEY
              valueFrom: { secretKeyRef: { name: appsignal-app, key: push-api-key } }
            - name: APPSIGNAL_COLLECTOR_ENDPOINT
              valueFrom: { secretKeyRef: { name: appsignal-app, key: collector-endpoint } }
            - name: APP_REVISION
              valueFrom: { secretKeyRef: { name: appsignal-app, key: revision } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: APPSIGNAL_HOSTNAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: APPSIGNAL_SERVICE_NAME, value: orders-web }
            - { name: DATABASE_URL, value: "postgres://ijzerhaven:ijzerhaven@postgres:5432/orders" }
            - { name: PAYMENTS_URL, value: "http://payments-api:4000" }
            - { name: MQTT_HOST, value: rabbitmq }
            - { name: MQTT_USERNAME, value: ijzerhaven }
            - { name: MQTT_PASSWORD, value: ijzerhaven }
            # Resource attributes land on every span this pod sends.
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.name=$(POD_NAME),k8s.node.name=$(NODE_NAME),k8s.namespace.name=ijzerhaven,k8s.deployment.name=orders-web,k8s.manifest.url=https://github.com/ophelan1/raw-materials-demo/blob/$(APP_REVISION)/k8s/app.yaml#L45"
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: orders-web
  namespace: ijzerhaven
spec:
  selector: { app: orders-web }
  ports: [{ port: 3000 }]
---
# ---------------------------------------------------------------- payments-api
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: ijzerhaven
spec:
  replicas: 3
  selector:
    matchLabels: { app: payments-api }
  template:
    metadata:
      labels: { app: payments-api }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels: { app: payments-api }
      volumes:
        - name: acquirer-mtls
          secret: { secretName: acquirer-mtls }
      containers:
        - name: payments-api
          image: ijzerhaven/payments:1
          imagePullPolicy: Never
          ports: [{ containerPort: 4000 }]
          env:
            - { name: APPSIGNAL_ACTIVE, value: "true" }
            - { name: APPSIGNAL_APP_ENV, value: production }
            - { name: APPSIGNAL_IGNORE_ACTIONS, value: "GET /healthz" }
            - name: APPSIGNAL_APP_NAME
              valueFrom: { secretKeyRef: { name: appsignal-app, key: app-name } }
            - name: APPSIGNAL_PUSH_API_KEY
              valueFrom: { secretKeyRef: { name: appsignal-app, key: push-api-key } }
            - name: APPSIGNAL_COLLECTOR_ENDPOINT
              valueFrom: { secretKeyRef: { name: appsignal-app, key: collector-endpoint } }
            - name: APP_REVISION
              valueFrom: { secretKeyRef: { name: appsignal-app, key: revision } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: APPSIGNAL_HOSTNAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: APPSIGNAL_SERVICE_NAME, value: payments-api }
            - { name: DATABASE_URL, value: "postgres://ijzerhaven:ijzerhaven@postgres:5432/orders" }
            - { name: ACQUIRER_TLS_DIR, value: /etc/payments/tls }
            - { name: FAILURE_INTERVAL_MINUTES, value: "10" }
            - { name: FAILURE_DURATION_SECONDS, value: "120" }
            # Resource attributes land on every span this pod sends.
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.name=$(POD_NAME),k8s.node.name=$(NODE_NAME),k8s.namespace.name=ijzerhaven,k8s.deployment.name=payments-api,k8s.manifest.url=https://github.com/ophelan1/raw-materials-demo/blob/$(APP_REVISION)/k8s/app.yaml#L112"
          volumeMounts:
            - { name: acquirer-mtls, mountPath: /etc/payments/tls, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: 4000 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: ijzerhaven
spec:
  selector: { app: payments-api }
  ports: [{ port: 4000 }]
---
# ---------------------------------------------------------------- traffic
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic
  namespace: ijzerhaven
spec:
  replicas: 1
  selector:
    matchLabels: { app: traffic }
  template:
    metadata:
      labels: { app: traffic }
    spec:
      containers:
        - name: traffic
          image: ijzerhaven/traffic:1
          imagePullPolicy: Never
          env:
            - { name: ORDERS_URL, value: "http://orders-web:3000" }
            - { name: REQUESTS_PER_SECOND, value: "0.1" }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
---
# ---------------------------------------------------------------- capacity-metrics
apiVersion: v1
kind: ServiceAccount
metadata:
  name: capacity-metrics
  namespace: ijzerhaven
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: capacity-metrics
rules:
  - apiGroups: [""]
    resources: [nodes, pods, nodes/proxy, nodes/stats, nodes/metrics]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: capacity-metrics
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: capacity-metrics }
subjects:
  - { kind: ServiceAccount, name: capacity-metrics, namespace: ijzerhaven }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capacity-metrics
  namespace: ijzerhaven
spec:
  replicas: 1
  selector:
    matchLabels: { app: capacity-metrics }
  template:
    metadata:
      labels: { app: capacity-metrics }
    spec:
      serviceAccountName: capacity-metrics
      containers:
        - name: capacity-metrics
          image: ijzerhaven/capacity-metrics:1
          imagePullPolicy: Never
          env:
            - { name: APPSIGNAL_ACTIVE, value: "true" }
            - { name: APPSIGNAL_APP_ENV, value: production }
            - { name: APPSIGNAL_ENABLE_HOST_METRICS, value: "false" }
            - name: APPSIGNAL_APP_NAME
              valueFrom: { secretKeyRef: { name: appsignal-app, key: app-name } }
            - name: APPSIGNAL_PUSH_API_KEY
              valueFrom: { secretKeyRef: { name: appsignal-app, key: push-api-key } }
            - name: APPSIGNAL_HOSTNAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 256Mi }
---
# ---------------------------------------------------------------- postgres-metrics
