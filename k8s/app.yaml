---
# ---------------------------------------------------------------- rabbitmq (MQTT broker)
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: ijzerhaven
data:
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_mqtt,rabbitmq_prometheus].
  20-mqtt.conf: |
    mqtt.allow_anonymous = false
    mqtt.vhost = /
    mqtt.exchange = amq.topic
    mqtt.prefetch = 10
    # RabbitMQ sizes its memory alarm from the node's RAM, not the pod limit.
    # Pin it below the 768Mi limit so the alarm fires before an OOM kill.
    vm_memory_high_watermark.absolute = 512MiB
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: ijzerhaven
spec:
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      volumes:
        - name: config
          configMap: { name: rabbitmq-config }
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: ijzerhaven }
            - { name: RABBITMQ_DEFAULT_PASS, value: ijzerhaven }
          ports:
            - { name: mqtt, containerPort: 1883 }
            - { name: management, containerPort: 15672 }
            - { name: prometheus, containerPort: 15692 }
          volumeMounts:
            - { name: config, mountPath: /etc/rabbitmq/enabled_plugins, subPath: enabled_plugins }
            - { name: config, mountPath: /etc/rabbitmq/conf.d/20-mqtt.conf, subPath: 20-mqtt.conf }
          readinessProbe:
            tcpSocket: { port: 1883 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: ijzerhaven
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: mqtt, port: 1883 }
    - { name: management, port: 15672 }
    - { name: prometheus, port: 15692 }
