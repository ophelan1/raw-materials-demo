server {
  listen 80;
  root /usr/share/nginx/html;

  # The React app: every non-file path serves index.html (client-side routes).
  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # API calls go to orders-web. nginx passes the browser's traceparent header
  # through unchanged, so the back end continues the browser's trace.
  location /api/ {
    proxy_pass http://orders-web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /healthz {
    return 200 "ok";
  }
}
